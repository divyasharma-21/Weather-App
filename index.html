<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="start-screen active">
    <h1>WEATHER APP</h1>
    <input  type="text" placeholder="City Name" class="cityName"><br>
    <button type="submit" id="btn">Get Weather</button>
    </div>
    <div class="data-screen ">
        <button id="backBtn">← Back</button>
        <h1 class="cityDisplay"></h1>
        <p class="tempDisplay"></p>
        <p class="humidityDisplay"></p>
        <p class="descDisplay"></p>
        <p class="emojiDisplay"></p>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
